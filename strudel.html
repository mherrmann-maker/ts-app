<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>SYNTH — Visual Synthesizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="./assets/strudel-COD8OZ-t.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="./assets/strudel-rTCgXhy-.css">
</head>
<body>

  <!-- Header / Transport -->
  <header class="transport">
    <div class="transport-logo">
      <span class="logo-wave">〜</span>
      <span class="logo-name">SYNTH</span>
    </div>

    <button id="btn-play" class="t-btn play-btn">
      <svg id="ico-play"  viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="ico-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button id="btn-stop" class="t-btn stop-btn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
    </button>

    <div class="bpm-ctrl">
      <span class="ctrl-lbl">BPM</span>
      <button class="bpm-arrow" id="bpm-down">−</button>
      <span id="bpm-val" class="bpm-val">120</span>
      <button class="bpm-arrow" id="bpm-up">+</button>
    </div>

    <div class="vol-ctrl">
      <span class="ctrl-lbl">VOL</span>
      <input type="range" id="master-vol" min="-30" max="0" step="1" value="-6" class="t-slider" />
    </div>

    <a href="index.html" class="t-back">← zurück</a>
  </header>

  <!-- Tab bar -->
  <nav class="tab-bar">
    <button class="tab active" data-tab="drums">🥁 DRUMS</button>
    <button class="tab" data-tab="melody">🎹 MELODIE</button>
    <button class="tab" data-tab="synth">🎛 SYNTH</button>
    <button class="tab" data-tab="fx">✨ EFFEKTE</button>
  </nav>

  <!-- ── DRUMS TAB ── -->
  <section id="tab-drums" class="tab-panel active">
    <div class="sequencer" id="drum-sequencer">
      <!-- filled by JS -->
    </div>
    <div class="step-indicators">
      <!-- 16 tiny beat indicators -->
    </div>
  </section>

  <!-- ── MELODY TAB ── -->
  <section id="tab-melody" class="tab-panel">
    <p class="melody-hint">① Schritt antippen  → ② Note wählen</p>
    <div class="sequencer" id="melody-sequencer">
      <!-- filled by JS -->
    </div>
    <div class="keyboard-wrap">
      <div id="keyboard" class="keyboard">
        <!-- filled by JS -->
      </div>
    </div>
  </section>

  <!-- ── SYNTH TAB ── -->
  <section id="tab-synth" class="tab-panel">
    <div class="synth-section">
      <h3 class="section-title">WELLENFORM</h3>
      <div class="wave-btns" id="wave-btns">
        <button class="wave-btn active" data-wave="sawtooth">SAW ⋀</button>
        <button class="wave-btn" data-wave="square">SQR ⊓</button>
        <button class="wave-btn" data-wave="triangle">TRI △</button>
        <button class="wave-btn" data-wave="sine">SIN ∿</button>
      </div>
    </div>

    <div class="synth-section">
      <h3 class="section-title">FILTER</h3>
      <div class="knob-row">
        <div class="knob-wrap">
          <canvas class="knob" id="knob-cutoff" width="64" height="64" data-min="80" data-max="12000" data-val="2000" data-log="true"></canvas>
          <span class="knob-lbl">CUTOFF</span>
        </div>
        <div class="knob-wrap">
          <canvas class="knob" id="knob-res" width="64" height="64" data-min="0" data-max="15" data-val="2"></canvas>
          <span class="knob-lbl">RESONANZ</span>
        </div>
      </div>
    </div>

    <div class="synth-section">
      <h3 class="section-title">HÜLLKURVE (ADSR)</h3>
      <div class="knob-row">
        <div class="knob-wrap">
          <canvas class="knob" id="knob-attack"  width="64" height="64" data-min="0.001" data-max="2" data-val="0.01"></canvas>
          <span class="knob-lbl">ATTACK</span>
        </div>
        <div class="knob-wrap">
          <canvas class="knob" id="knob-decay"   width="64" height="64" data-min="0.01"  data-max="2" data-val="0.2"></canvas>
          <span class="knob-lbl">DECAY</span>
        </div>
        <div class="knob-wrap">
          <canvas class="knob" id="knob-sustain" width="64" height="64" data-min="0"     data-max="1" data-val="0.5"></canvas>
          <span class="knob-lbl">SUSTAIN</span>
        </div>
        <div class="knob-wrap">
          <canvas class="knob" id="knob-release" width="64" height="64" data-min="0.01"  data-max="3" data-val="0.4"></canvas>
          <span class="knob-lbl">RELEASE</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ── FX TAB ── -->
  <section id="tab-fx" class="tab-panel">
    <div class="synth-section">
      <h3 class="section-title">HALL (REVERB)</h3>
      <div class="knob-row">
        <div class="knob-wrap">
          <canvas class="knob" id="knob-rev-wet"   width="64" height="64" data-min="0" data-max="1" data-val="0.1"></canvas>
          <span class="knob-lbl">MIX</span>
        </div>
        <div class="knob-wrap">
          <canvas class="knob" id="knob-rev-decay" width="64" height="64" data-min="0.1" data-max="8" data-val="2"></canvas>
          <span class="knob-lbl">ABKLINGEN</span>
        </div>
      </div>
    </div>

    <div class="synth-section">
      <h3 class="section-title">ECHO (DELAY)</h3>
      <div class="knob-row">
        <div class="knob-wrap">
          <canvas class="knob" id="knob-del-wet"  width="64" height="64" data-min="0"   data-max="0.8" data-val="0"></canvas>
          <span class="knob-lbl">MIX</span>
        </div>
        <div class="knob-wrap">
          <canvas class="knob" id="knob-del-feed" width="64" height="64" data-min="0"   data-max="0.85" data-val="0.3"></canvas>
          <span class="knob-lbl">FEEDBACK</span>
        </div>
      </div>
    </div>

    <div class="synth-section">
      <h3 class="section-title">VERZERRUNG (DISTORTION)</h3>
      <div class="knob-row">
        <div class="knob-wrap">
          <canvas class="knob" id="knob-dist" width="64" height="64" data-min="0" data-max="0.9" data-val="0"></canvas>
          <span class="knob-lbl">DRIVE</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Visualizer bar at bottom -->
  <div class="viz-bar">
    <canvas id="viz-canvas" class="viz-canvas"></canvas>
  </div>


</body>
</html>
