name: Deploy to GitHub Pages

# Auf diesem Branch: Test-Deployment in einen unverlinkten Unterordner,
# damit das bestehende Pages-Deployment (Haupt-URL) unangetastet bleibt.
# Vor einem Merge in den Default-Branch destination_dir entfernen und
# die ursprünglichen Trigger (main, claude/install-github-app-W4Nga) wiederherstellen.
on:
  push:
    branches:
      - claude/music-rhythm-video-editor-lj4ypj
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview-d1e6730f
